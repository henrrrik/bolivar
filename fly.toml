app = 'bolivar'
primary_region = 'arn'

[build]

[env]
  LISTEN_ADDR = ':8080'
  DB_PATH = '/data/bolivar.db'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0

[[vm]]
  memory = '256mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'bolivar_data'
  destination = '/data'
